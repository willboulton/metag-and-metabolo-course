  "@type": "CreativeWork"
  "@id": "https://bioschemas.org/profiles/TrainingMaterial/1.0-RELEASE"

# --- Minimum properties ---
name: "Reanalysing the DIME Dataset: A case-study in Metagenomics and Metabolomics Analysis"
description: >-
  An integrated metagenomics and metabolomics analysis course built around the
  DIME human dietary-intervention dataset. It follows a single end-to-end research
  workflow — MAG recovery with MATAFILER4, LC-MS metabolomics preprocessing,
  cross-domain network inference with SpiecEasi, and statistical analysis in R —
  combining conceptual explanation with runnable code.
# Canonical public URL. Update if you rename the repo or use a custom domain.
url: "https://willboulton.github.io/metag-and-metabolo-course/"
keywords:
  - metagenomics
  - metabolomics
  - microbiome
  - gut microbiome
  - bioinformatics
  - metagenome-assembled genomes
  - LC-MS
  - short-chain fatty acids
  - network inference
  - numerical ecology
  - differential abundance

